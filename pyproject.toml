[project]
name = "image_morph_bot"
version = "1.0.0"
description = "Telegram bot for converting images between formats"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiogram==3.4.1",
    "pillow==10.4.0",
    "python-dotenv==1.0.1",
    "aiofiles==23.2.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.mise]
python = "3.11.9"
